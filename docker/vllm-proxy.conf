server {
    # endpoint for the outer proxies
    listen 8000;

    # metrics/health queries are safe to be open
    location = /health {
        proxy_pass http://127.0.0.1:8001;
        include proxy_params;
    }

    # the inference paths, should be guarded by API key
    location ~ ^/(v1|v2|inference)($|/) {
        proxy_pass http://127.0.0.1:8001;
        include proxy_params;
        proxy_set_header Authorization $http_authorization; # Explicit pass-through safety

        # inference can take a long time
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # streaming protocols for Server-Sent Events
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # everything else gets forbidden
    location / {
        return 403 "Access Denied: Use standard paths.\n";
    }
}
