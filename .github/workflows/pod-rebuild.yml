name: Pod Image Sync & Build

on:
  schedule:
    - cron: '14 3 * * 1,4' # Runs twice a week at 3:14
  push:
    branches:
      - main
    paths:
      - 'docker/**'
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project assets
        uses: actions/checkout@v7

      - name: Log into Docker Hub Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # This check only runs during scheduled crons
      - name: Check for upstream updates
        if: github.event_name == 'schedule'
        id: cache-check
        uses: lucacome/docker-image-update-checker@v3
        with:
          base-image: vllm/vllm-openai:latest
          image: ${{ vars.DOCKERHUB_USERNAME }}/vellmi-pod:latest
          platforms: linux/amd64

      - name: Set up Docker Buildx
        if: github.event_name != 'schedule' || steps.cache-check.outputs.needs-updating == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Remote Build and Push
        if: github.event_name != 'schedule' || steps.cache-check.outputs.needs-updating == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          push: true
          pull: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/vellmi-pod:latest
          platforms: linux/amd64
