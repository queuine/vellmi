[vllm]
load = "poolside/Laguna-XS-2.1-NVFP4"
serve = "poolside/laguna-xs-2.1-nvfp4-kv-fp8"

params = """
--max-model-len 24K
--max-num-batched-tokens 12K
--max-num-seqs 6
--kv-cache-dtype fp8
--enable-chunked-prefill
--gpu-memory-utilization 0.92
--moe-backend marlin
--trust-remote-code
--reasoning-parser poolside_v1
"""

[env]
FORWARDED_ALLOW_IPS = "*"

[boot]
image = "queuine/vellmi-pod:latest"

[gpu]
label = "NVIDIA A40"
count = 1

[storage]
system = 20
models = 40

